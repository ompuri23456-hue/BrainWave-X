<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — BrainWave AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-card">
  <div class="auth-logo">⚡ BrainWave AI</div>

  {% if success %}
    <div style="text-align:center;">
      <div style="font-size:3rem;margin-bottom:1rem;">✅</div>
      <h2 class="auth-title">Password Updated!</h2>
      <p class="auth-sub">Your password has been changed successfully.</p>
      <a href="/login" class="auth-btn d-block mt-3" style="text-decoration:none;">Login Now</a>
    </div>

  {% else %}
    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-sub">Enter your email and username to verify your identity, then set a new password.</p>

    {% if error %}
    <div class="auth-error"><i class="fa fa-circle-exclamation me-2"></i>{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="auth-field">
        <i class="fa fa-envelope"></i>
        <input type="email" name="email" placeholder="Your email address" required autofocus>
      </div>
      <div class="auth-field">
        <i class="fa fa-user"></i>
        <input type="text" name="username" placeholder="Your username" required>
      </div>
      <div class="auth-field">
        <i class="fa fa-lock"></i>
        <input type="password" name="password" placeholder="New password (min 6 chars)" required>
      </div>
      <div class="auth-field">
        <i class="fa fa-lock"></i>
        <input type="password" name="confirm" placeholder="Confirm new password" required>
      </div>
      <button type="submit" class="auth-btn">
        <i class="fa fa-check me-2"></i>Reset Password
      </button>
    </form>

    <p class="auth-switch"><a href="/login"><i class="fa fa-arrow-left me-1"></i>Back to Login</a></p>
  {% endif %}
</div>

</body>
</html>
