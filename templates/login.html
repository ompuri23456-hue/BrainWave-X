<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BrainWave AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-card">
  <div class="auth-logo">⚡ BrainWave AI</div>
  <h2 class="auth-title">Welcome back</h2>
  <p class="auth-sub">Sign in to access your notes history</p>

  {% if error %}
  <div class="auth-error"><i class="fa fa-circle-exclamation me-2"></i>{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="auth-field">
      <i class="fa fa-envelope"></i>
      <input type="email" name="email" placeholder="Email address" required>
    </div>
    <div class="auth-field">
      <i class="fa fa-lock"></i>
      <input type="password" name="password" placeholder="Password" required>
    </div>
    <button type="submit" class="auth-btn">Sign In</button>
  </form>

  <p class="auth-switch" style="margin-top:0.8rem;">
    <a href="/forgot-password">Forgot password?</a>
  </p>
  <p class="auth-switch">Don't have an account? <a href="/register">Register</a></p>
</div>

</body>
</html>
