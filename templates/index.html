<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainWave AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<!-- Navbar -->
<nav class="navbar navbar-dark">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="navbar-brand">⚡ BrainWave AI</span>
    <div class="d-flex align-items-center gap-3">
      <div class="nav-links d-none d-md-flex align-items-center gap-3">
        <a href="/" class="active-link">Notes</a>
        <a href="/btech">B.Tech</a>
        <a href="#" onclick="openChat()">Chat</a>
        <a href="#" onclick="toggleHistory()"><i class="fa fa-clock-rotate-left me-1"></i>History</a>
        {% if session.get('is_admin') %}
        <a href="/admin" style="color:#a78bfa;"><i class="fa fa-shield-halved me-1"></i>Admin</a>
        {% endif %}
      </div>
      <div class="user-pill">
        <i class="fa fa-circle-user"></i> {{ username }}
        <a href="/logout" title="Logout"><i class="fa fa-right-from-bracket ms-2"></i></a>
      </div>
    </div>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <h1>Learn Anything, Instantly</h1>
  <p>AI-powered notes on any topic, saved to your personal history.</p>
  <div class="search-wrap">
    <input id="topic" type="text" placeholder="Enter a topic (e.g. Machine Learning)..."
           onkeydown="if(event.key==='Enter') getNotes()">
    <button onclick="getNotes()"><i class="fa fa-bolt me-1"></i> Generate</button>
  </div>
  <!-- Mode Selector -->
  <div class="mode-selector mt-3">
    <button class="mode-btn active" data-mode="default" onclick="setMode(this)">📖 Default</button>
    <button class="mode-btn" data-mode="exam" onclick="setMode(this)">🎯 Exam</button>
    <button class="mode-btn" data-mode="revision" onclick="setMode(this)">⚡ Revision</button>
    <button class="mode-btn" data-mode="deep" onclick="setMode(this)">🔬 Deep Learn</button>
    <button class="mode-btn" data-mode="viva" onclick="setMode(this)">🎤 Viva</button>
    <button class="mode-btn" data-mode="quiz" onclick="setMode(this)">🧩 Quiz</button>
  </div>
</section>

<div class="container pb-5">

  <!-- Notes -->
  <section id="notes-section" class="mb-5">
    <!-- Duplicate warning -->
    <div id="duplicateWarn" class="duplicate-warn" style="display:none;">
      <i class="fa fa-lightbulb me-2"></i>
      <span id="duplicateMsg"></span>
      <div class="mt-2 d-flex gap-2">
        <button class="mode-btn active" onclick="forceGenerate()">🔄 Regenerate</button>
        <button class="mode-btn" onclick="reviewExisting()">👁 Review Existing</button>
      </div>
    </div>
    <div id="notesLoader" style="display:none;">
      <div class="notes-card">
        <div class="skeleton"></div>
        <div class="skeleton" style="width:80%"></div>
        <div class="skeleton" style="width:60%"></div>
        <div class="skeleton" style="width:90%"></div>
        <div class="skeleton" style="width:50%"></div>
      </div>
    </div>
    <div id="notesSection" style="display:none;">
      <div class="section-title"><span><i class="fa fa-brain"></i></span> Generated Notes</div>
      <div class="notes-card">
        <div class="notes-actions">
          <button class="action-btn" onclick="copyNotes()"><i class="fa fa-copy me-1"></i>Copy</button>
          <button class="action-btn" onclick="downloadPDF()"><i class="fa fa-file-pdf me-1"></i>PDF</button>
        </div>
        <div id="notesContent" class="notes-formatted"></div>
      </div>
    </div>
  </section>

</div>

<!-- History Drawer -->
<div id="historyOverlay" onclick="toggleHistory()"></div>
<div id="historyDrawer">
  <div class="drawer-header">
    <span><i class="fa fa-clock-rotate-left me-2"></i>Notes History</span>
    <button onclick="toggleHistory()"><i class="fa fa-times"></i></button>
  </div>
  <div class="drawer-search">
    <i class="fa fa-search"></i>
    <input type="text" id="historySearch" placeholder="Search history..." oninput="filterHistory()">
  </div>
  <div id="historyList" class="drawer-body">
    <p class="text-muted text-center mt-4">Loading...</p>
  </div>
</div>

<!-- Chat Toggle -->
<button id="chatToggle" onclick="toggleChat()" title="Open AI Chat">
  <i class="fa fa-comment-dots"></i>
</button>

<!-- Chat Box -->
<div id="chatBox">
  <div class="chat-header">
    <div>
      <span>AI Assistant</span><br>
      <span class="chat-status">🟢 Online</span>
    </div>
    <button onclick="toggleChat()" style="background:none;border:none;color:#fff;font-size:1.1rem;cursor:pointer;">
      <i class="fa fa-times"></i>
    </button>
  </div>
  <div id="chatBody">
    <div class="msg-bot">Hey! Ask me anything 👋</div>
  </div>
  <div class="chat-footer">
    <input id="msg" type="text" placeholder="Type a message..."
           onkeydown="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
